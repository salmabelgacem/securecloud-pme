name: SecureCloud PME - Pipeline DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Moindre privilege : lecture seule par defaut
permissions:
  contents: read

jobs:
  # ---------- 1. Secrets dans le code ----------
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 2. Analyse du code (SAST) ----------
  sonarcloud:
    name: SonarCloud (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ---------- 3. Dependances (SCA) ----------
  snyk:
    name: Snyk (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer les dependances (verrouillees par hash)
        run: |
          pip install --require-hashes --only-binary :all: -r app/requirements.txt
      - name: Installer Snyk CLI (binaire verifie par sha256)
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      - name: Scanner les dependances
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk test
          --file=app/requirements.txt
          --package-manager=pip
          --command=python
          --severity-threshold=high

  # ---------- 4. Infrastructure as Code ----------
  checkov:
    name: Checkov (Terraform + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scanner Terraform et Dockerfile
        uses: bridgecrewio/checkov-action@b782b35c8411ff565b881fba67ceebdb426d7dc4 # v12.3147.0
        with:
          directory: .
          framework: terraform,dockerfile
          output_format: cli
          compact: true
          quiet: true

  # ---------- 5. Image : build + Trivy + ZAP + push ECR ----------
  build-scan:
    name: Build + Trivy + ZAP + push ECR
    runs-on: ubuntu-latest
    needs: [gitleaks, sonarcloud, snyk, checkov]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image Docker
        run: docker build -t securecloud-pme-app:${{ github.sha }} .

      - name: Trivy - bloque si faille HIGH/CRITICAL corrigeable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: securecloud-pme-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Lancer le conteneur pour le test DAST
        run: |
          docker run -d --name app -p 5000:5000 securecloud-pme-app:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && break
            sleep 2
          done

      - name: OWASP ZAP - scan baseline (DAST)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:5000
          allow_issue_writing: false
          fail_action: false
          artifact_name: rapport-zap

      - name: Arreter le conteneur
        if: always()
        run: docker rm -f app

      - name: Push vers ECR (branche main uniquement)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-1
        run: |
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.us-east-1.amazonaws.com
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag securecloud-pme-app:${{ github.sha }} "$REGISTRY/securecloud-pme-app:${{ github.sha }}"
          docker push "$REGISTRY/securecloud-pme-app:${{ github.sha }}"

  # ---------- 6. Deploiement en production (approbation manuelle) ----------
  deploy:
    name: Deploiement production (ECS)
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      CLUSTER: securecloud-pme-cluster
      SERVICE: securecloud-pme-service
      FAMILY: securecloud-pme-task
    steps:
      - name: Nouvelle revision de la definition de tache
        id: td
        run: |
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.us-east-1.amazonaws.com
          IMAGE="$REGISTRY/securecloud-pme-app:${{ github.sha }}"
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > td.json
          jq --arg IMG "$IMAGE" '
            (.containerDefinitions[] | select(.name == "app") | .image) = $IMG
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)' td.json > new-td.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-td.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "Nouvelle revision : $NEW_ARN"
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Mise a jour du service ECS (sans coupure)
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "${{ steps.td.outputs.arn }}" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Deploiement termine"