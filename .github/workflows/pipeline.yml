name: SecureCloud PME - Pipeline DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Moindre privilege : lecture seule par defaut
permissions:
  contents: read

jobs:
  # ---------- 1. Secrets dans le code ----------
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 2. Analyse du code (SAST) ----------
  sonarcloud:
    name: SonarCloud (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ---------- 3. Dependances (SCA) ----------
  snyk:
    name: Snyk (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install -r app/requirements.txt
      - name: Installer Snyk CLI
        run: npm install -g snyk
      - name: Scanner les dependances
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk test
          --file=app/requirements.txt
          --package-manager=pip
          --command=python
          --severity-threshold=high

  # ---------- 4. Infrastructure as Code ----------
  checkov:
    name: Checkov (Terraform + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer Checkov
        run: pip install checkov
      - name: Scanner Terraform et Dockerfile
        run: checkov -d . --framework terraform dockerfile --compact --quiet

  # ---------- 5. Image : build + Trivy + ZAP ----------
  build-scan:
    name: Build + Trivy + ZAP
    runs-on: ubuntu-latest
    needs: [gitleaks, sonarcloud, snyk, checkov]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image Docker
        run: docker build -t securecloud-pme-app:${{ github.sha }} .

      - name: Trivy - bloque si faille HIGH/CRITICAL corrigeable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: securecloud-pme-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Lancer le conteneur pour le test DAST
        run: |
          docker run -d --name app -p 5000:5000 securecloud-pme-app:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && break
            sleep 2
          done

      - name: OWASP ZAP - scan baseline (DAST)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:5000
          allow_issue_writing: false
          fail_action: false
          artifact_name: rapport-zap

      - name: Arreter le conteneur
        if: always()
        run: docker rm -f app